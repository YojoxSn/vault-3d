name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install, check, test, build
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Absolute social-preview URL (crawlers ignore relative og:image)
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/social-preview.png"
          sed -i "s#content=\"./social-preview.png\"#content=\"$URL\"#" app/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
